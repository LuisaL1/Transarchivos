# Integración continua: se ejecuta en cada push y pull request a main.
# Calidad → seguridad → pruebas de extremo a extremo. Ver TESTING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad (tipos, lint, unitarias, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - name: SEO del HTML pre-generado
        run: pnpm test:seo
      - name: Tamaño del build
        run: du -sh dist && find dist/assets -name '*.js' -size +600k -print | (! grep .) || (echo "Hay un bundle JS de más de 600 KB" && exit 1)

  seguridad:
    name: Seguridad (dependencias, secretos, código)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Vulnerabilidades conocidas en dependencias
        run: pnpm test:deps
      - name: Revisión estática (cabeceras, secretos, patrones inseguros)
        run: pnpm test:security
      - name: Búsqueda de secretos en el historial
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Extremo a extremo + accesibilidad
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 14
