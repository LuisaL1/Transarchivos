<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo:start-->
    <title>Gestión documental en Bogotá | Transarchivos Ltda.</title>
    <meta name="robots" content="noindex, nofollow" />
    <!--seo:end-->
    <!-- Las etiquetas SEO de cada página (título, descripción, canónica, Open
         Graph, JSON-LD) las inserta scripts/prerender.mjs en el build y
         SeoHead al navegar. Ver docs/06-seo.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" />
    <link rel="preload" as="image" href="/videos/hero-poster.jpg" fetchpriority="high" />
    <!-- Ícono: la "t" manuscrita del logo sobre el azul corporativo. Versión
         gruesa para la pestaña (16/32/48 px) y con la flecha del logo para
         pantallas de inicio (180/192/512 px). -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="theme-color" content="#272B7C" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
