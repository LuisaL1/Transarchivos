# Análisis de calidad con SonarQube (ver docs/10-sonarqube.md)
sonar.projectKey=transarchivos-web
sonar.projectName=Transarchivos · Sitio web
sonar.sourceEncoding=UTF-8

# Código del sitio, funciones de servidor y servidor de producción
sonar.sources=src,api,scripts,server.mjs
sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts,tests/**/*.tsx
# Puntos de arranque sin lógica propia (se verifican en los recorridos de navegador)
sonar.coverage.exclusions=src/main.tsx,src/entry-server.tsx
sonar.exclusions=**/node_modules/**,dist/**,dist-ssr/**,coverage/**,public/**,src/assets/**

# Cobertura de pruebas: unitarias y del servidor/HTML generado (pnpm build && pnpm test:coverage:all)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/seo/lcov.info

# Los archivos de contenido repiten a propósito la misma estructura en español e
# inglés (src/data/*.en.ts, src/i18n/ui.ts…): no se cuentan como código duplicado.
sonar.cpd.exclusions=src/data/**,src/i18n/**
